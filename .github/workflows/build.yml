name: build

# Compila el consumidor ETW (src_etw_consumer) en Windows/MSVC.
# Nota: el binario lleva /INTEGRITYCHECK -> enlaza sin problema, pero NO cargará
# en runtime sin firma AM de Microsoft (ver src_etw_consumer/README.md). El CI
# solo valida que compila y enlaza; no firma ni ejecuta.

on:
  push:
    paths:
      - 'src_etw_consumer/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src_etw_consumer/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: cmake --version
        working-directory: src_etw_consumer

      # Dejar que CMake elija el generador de Visual Studio instalado en el
      # runner (en vez de fijar "Visual Studio 17 2022") para sobrevivir a
      # cambios de imagen. -A x64 es válido con el generador VS por defecto.
      - name: Configure (CMake, VS por defecto, x64)
        run: cmake -B build -A x64
        working-directory: src_etw_consumer

      - name: Build (Release)
        working-directory: src_etw_consumer
        shell: pwsh
        run: |
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content build.log |
              Select-String -Pattern 'error|fatal|LNK|unresolved' |
              Select-Object -Last 40 |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
          }
          exit $code

      - name: Test (ctest)
        working-directory: src_etw_consumer
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload edrsvc.exe
        uses: actions/upload-artifact@v4
        with:
          name: edrsvc-x64-release
          path: src_etw_consumer/build/Release/edrsvc.exe
          if-no-files-found: error
